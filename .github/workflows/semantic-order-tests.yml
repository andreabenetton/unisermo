name: Mirrored semantic-order offline tests
on:
  push:
    branches: [research/semantic-order-counterbalance-20261024]
    paths:
      - 'benchmarks/semantic_order.py'
      - 'benchmarks/corpus/semantic-order-dev-001.jsonl'
      - 'tests/test_semantic_order.py'
      - '.github/workflows/semantic-order-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate mirrored corpus and scoring
        run: python -m unittest discover -s tests -p 'test_semantic_order.py' -v
