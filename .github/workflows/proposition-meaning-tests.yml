name: Proposition meaning offline tests
on:
  push:
    branches: [research/proposition-meaning-pilot-20261024]
    paths:
      - 'benchmarks/proposition_meaning.py'
      - 'benchmarks/corpus/proposition-dev-001.jsonl'
      - 'tests/test_proposition_meaning.py'
      - '.github/workflows/proposition-meaning-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate parser-gated propositions and semantic scoring
        run: python -m unittest discover -s tests -p 'test_proposition_meaning.py' -v
