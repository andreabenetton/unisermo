name: One-shot OpenRouter smoke (12 requests maximum)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/openrouter-one-shot-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: qwen
            model: qwen/qwen3-32b
    steps:
      - name: Verify one-shot authorization marker
        env:
          ACTUAL_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          test "$ACTUAL_COMMIT_MESSAGE" = 'ci: Qwen no-think two-request probe' || exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate runner offline
        run: |
          python -m unittest discover -s tests -p 'test_openrouter_runner.py' -v
          python -m unittest discover -s tests -p 'test_root_recognition.py' -v
      - name: Run six isolated paid requests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL: ${{ matrix.model }}
          SLUG: ${{ matrix.slug }}
        run: |
          test -n "$OPENROUTER_API_KEY" || { echo 'OPENROUTER_API_KEY unavailable'; exit 1; }
          python -m benchmarks.openrouter_runner \
            --model "$MODEL" --subset probe --max-requests 2 \
            --output "benchmarks/reports/openrouter-smoke-$SLUG.jsonl"
      - name: Upload raw real-model replies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-smoke-${{ matrix.slug }}-${{ github.run_id }}
          path: benchmarks/reports/openrouter-smoke-${{ matrix.slug }}.jsonl
          if-no-files-found: warn
          retention-days: 14
