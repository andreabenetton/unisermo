name: One-shot source-licensed relational meaning pilot
on:
  push:
    branches: [research/relational-frame-gate-20261024]
    paths: ['.github/workflows/relational-frame-once.yml']
permissions:
  contents: read
concurrency:
  group: unisermo-relational-frames-20261024
  cancel-in-progress: false
jobs:
  trial:
    if: >-
      github.event.head_commit.message == 'ci: execute relational frame pilot once'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preflight canonical valency and budget limits
        run: |
          python -m unittest discover -s tests -p 'test_relational_frames.py' -v
          python -m unittest discover -s tests -p 'test_relational_frame_meaning.py' -v
          python - <<'PY'
          from benchmarks.relational_frame_meaning import MAX_CALLS,MAX_OUTPUT,OBSERVED_BUDGET_USD,MODEL,requests,load_corpus
          assert len(load_corpus())==12
          assert len(requests())==MAX_CALLS==24
          assert MAX_OUTPUT==650 and OBSERVED_BUDGET_USD==0.02
          assert MODEL=='qwen/qwen3-32b'
          print('Development-only, 24 calls max, USD 0.02 observed cost stop')
          PY
      - name: Run bounded Qwen relational meaning comparison
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m benchmarks.relational_frame_meaning --output benchmarks/reports/relational-frame-raw.jsonl
      - name: Save original and scored evidence, even on later failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relational-frame-${{ github.run_id }}
          path: benchmarks/reports/relational-frame-*
          if-no-files-found: warn
          retention-days: 30
