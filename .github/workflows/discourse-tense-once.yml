name: One-shot explicit tense comparison
on:
  push:
    branches: [main]
    paths: ['.github/workflows/discourse-tense-once.yml']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check one-shot authorization
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          test "$MSG" = 'ci: run explicit present tense comparison once' || exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate six questions
        run: |
          python - <<'PY'
          from benchmarks.discourse_tense_clarification import enhanced
          from benchmarks.discourse_semantics import build
          q,k=enhanced();old,key=build()
          assert len(q)==6
          assert k==key
          assert all(q[i]['messages'][0]['content'].endswith(old[i]['messages'][0]['content']) for i in range(6))
          PY
      - name: Run OpenRouter experiment
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m benchmarks.discourse_tense_runner --output benchmarks/reports/discourse-tense.jsonl
      - name: Archive responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discourse-tense-${{ github.run_id }}
          path: benchmarks/reports/discourse-tense*
          if-no-files-found: warn
          retention-days: 30
