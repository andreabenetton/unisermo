# Opt-in GitHub Actions benchmark. Does NOT modify/push the GlottoDelta atlas.
# Runs only in the Unisermo repository; the atlas vendor snapshot remains untouched.
name: OpenAI tokenizer pilot
on:
  workflow_dispatch:
  push:
    paths:
      - "benchmarks/**"
      - "formalization/**"
      - "language/**"
      - "tests/**"
      - "research/lexicon/candidate-register.json"
      - "research/lexicon/expansion-batch-001.json"
      - "research/lexicon/productive-compound-trials-001.json"
      - "research/lexicon/modern-form-seeds.json"
      - "research/lexicon/modern-form-seeds-v2.json"
      - ".github/workflows/benchmark-openai-tokenizers.yml"
jobs:
  tokenize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            benchmarks/requirements-openai.txt
            benchmarks/requirements-frequency.txt
      - name: Install official tokenizer
        run: python -m pip install -r benchmarks/requirements-openai.txt
      - name: Check pinned tokenizer version and offline grammar/corpus tests
        run: |
          python -m pip show tiktoken
          python -m unittest discover -s tests -p 'test_benchmarks.py' -v
          python -m unittest discover -s tests -p 'test_diagnostics.py' -v
          python benchmarks/build_pilot.py --check
          python -m benchmarks.build_expansion_001 --check
          python -m benchmarks.build_discourse_001 --check
          python -m unittest discover -s tests -p 'test_discourse_001.py' -v
          python -m unittest discover -s tests -p 'test_discourse_semantics.py' -v
          python -m unittest discover -s tests -p 'test_lexical_screen.py' -v
          python -m unittest discover -s tests -p 'test_review.py' -v
          python -m unittest discover -s tests -p 'test_modern_evidence.py' -v
          python -m unittest discover -s tests -p 'test_kaikki_extract.py' -v
          python -m unittest discover -s tests -p 'test_root_substitution.py' -v
          python -m unittest discover -s tests -p 'test_root_family_collisions.py' -v
          python -m unittest discover -s tests -p 'test_root_semantic_guard.py' -v
          python -m unittest discover -s tests -p 'test_root_recognition.py' -v
          python -m unittest discover -s tests -p 'test_open_inference.py' -v
          python -m unittest discover -s tests -p 'test_document_scaling.py' -v
          python -m unittest discover -s tests -p 'test_lexical_expansion.py' -v
          python -m unittest discover -s tests -p 'test_productive_compounds.py' -v
      - name: Tokenize pilot with two real OpenAI encodings
        run: python -m benchmarks measure-openai --include-draft --output-dir benchmarks/reports
      - name: Generate baseline diagnostic
        run: |
          python -m benchmarks.diagnostics \
            --reports benchmarks/reports/o200k_base-pilot.json benchmarks/reports/cl100k_base-pilot.json \
            --output benchmarks/reports/diagnostic-pilot.json
      - name: Screen lexical candidates (research only)
        run: python -m benchmarks.lexical_screen --output benchmarks/reports/lexical-screen.json
      - name: Install pinned modern-language frequency corpus
        run: python -m pip install -r benchmarks/requirements-frequency.txt
      - name: Measure modern surface-form frequencies (not concept recognition)
        run: python -m benchmarks.modern_evidence --output benchmarks/reports/modern-form-frequencies.json
      - name: Counterfactual root replacement with official OpenAI tokenizers
        run: python -m benchmarks.root_substitution --output-dir benchmarks/reports
      - name: Screen generated root families for collisions
        run: python -m benchmarks.root_family_collisions --output benchmarks/reports/root-family-collisions.json
      - name: Measure extended modern form-frequency corpus
        run: |
          python -m benchmarks.modern_evidence \
            --seeds research/lexicon/modern-form-seeds-v2.json \
            --output benchmarks/reports/modern-form-frequencies-v2.json
      - name: Test counterfactual dir parser parity
        run: python -m benchmarks.root_semantic_guard --output benchmarks/reports/root-semantic-parity.json
      - name: Build isolated blind lexical recognition prompts
        run: python -m benchmarks.root_recognition build --output-dir benchmarks/reports
      - name: Audit 100-concept experimental lexical expansion
        run: python -m benchmarks.lexical_expansion --output benchmarks/reports/lexical-expansion-001.json
      - name: Validate experimental productive compounds
        run: python -m benchmarks.productive_compounds --output benchmarks/reports/productive-compounds.json
      - name: Measure synthetic 100 and 1000 entry document header scaling
        run: python -m benchmarks.document_scaling --output benchmarks/reports/document-scaling.json
      - name: Publish machine-readable results as CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unisermo-openai-tokenizer-pilot
          path: |
            benchmarks/reports/o200k_base-pilot.json
            benchmarks/reports/cl100k_base-pilot.json
            benchmarks/reports/diagnostic-pilot.json
            benchmarks/reports/lexical-screen.json
            benchmarks/reports/modern-form-frequencies.json
            benchmarks/reports/modern-form-frequencies-v2.json
            benchmarks/reports/root-substitution-o200k_base.json
            benchmarks/reports/root-substitution-cl100k_base.json
            benchmarks/reports/root-family-collisions.json
            benchmarks/reports/root-semantic-parity.json
            benchmarks/reports/lexical-expansion-001.json
            benchmarks/reports/productive-compounds.json
            benchmarks/reports/document-scaling.json
            benchmarks/reports/root-recognition-prompts-v1.jsonl
            benchmarks/reports/root-recognition-answer-key-v1.jsonl
          if-no-files-found: error
