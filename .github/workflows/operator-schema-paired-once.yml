name: One-shot paired output schema
on:
  push:
    branches: [main]
    paths: ['.github/workflows/operator-schema-paired-once.yml']
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: One-shot guard
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          test "$MESSAGE" = 'ci: run paired output schema study once' || exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Confirm balanced trials
        run: |
          python - <<'PY'
          from benchmarks.operator_schema_paired import build
          q,answers=build()
          assert len(q)==16 and len(answers)==8
          assert sum(x['condition']=='generic' for x in q)==8
          assert q[0]['condition']=='generic' and q[2]['condition']=='strict'
          PY
      - name: Run sixteen capped API requests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m benchmarks.operator_schema_paired_runner --output benchmarks/reports/paired-schema.jsonl
      - name: Save raw and scored results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-schema-${{ github.run_id }}
          path: benchmarks/reports/paired-schema*
          if-no-files-found: warn
          retention-days: 30
