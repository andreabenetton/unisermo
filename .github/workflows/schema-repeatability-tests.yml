name: Schema repeatability offline tests
on:
  push:
    branches: [research/schema-repeatability-20261024]
    paths:
      - 'benchmarks/schema_repeatability.py'
      - 'tests/test_schema_repeatability.py'
      - '.github/workflows/schema-repeatability-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unit tests (no API keys)
        run: python -m unittest discover -s tests -p 'test_schema_repeatability.py' -v
