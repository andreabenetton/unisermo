name: Archive relational frame meaning evidence once
on:
  push:
    branches: [research/relational-frame-gate-20261024]
    paths: ['.github/workflows/relational-frame-archive-once.yml']
permissions:
  contents: write
  actions: read
jobs:
  archive:
    if: >-
      github.event.head_commit.message == 'ci: archive verified relational frames once'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Retrieve original paid experimental output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/relational-evidence
          gh run download 40089793501 --repo andreabenetton/unisermo --name relational-frame-40089793501 --dir /tmp/relational-evidence
          test -s /tmp/relational-evidence/relational-frame-raw.jsonl
          test -s /tmp/relational-evidence/relational-frame-raw.score.json
      - name: Verify original SHA, 24 requests, provider and score
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          from benchmarks.relational_frame_meaning import CORPUS,MODEL,load_corpus,score
          p=Path('/tmp/relational-evidence/relational-frame-raw.jsonl')
          s=json.loads(Path('/tmp/relational-evidence/relational-frame-raw.score.json').read_text())
          rows=[json.loads(line) for line in p.read_text(encoding='utf8').splitlines() if line.strip()]
          assert len(rows)==24 and len({r['id'] for r in rows})==24
          assert [r['call_order'] for r in rows]==list(range(1,25))
          assert all(r['returned_model']==MODEL for r in rows)
          assert all(r['finish_reason']=='stop' for r in rows)
          assert all(r['provider']=='DeepInfra' for r in rows)
          assert hashlib.sha256(CORPUS.read_bytes()).hexdigest()==s['corpus_sha256']
          assert hashlib.sha256(p.read_bytes()).hexdigest()==s['raw_sha256']
          assert abs(sum(r['usage']['cost'] for r in rows)-s['observed_cost_usd'])<1e-12
          assert s['observed_cost_usd']<.02
          again=score(rows,load_corpus())
          assert again['comparisons']==s['comparisons']
          assert again['calls']==s['calls']
          print('Verified exact 24 original outputs, score, cost, model and provenance')
          PY
      - name: Commit verbatim evidence
        run: |
          mkdir -p benchmarks/evidence
          cp /tmp/relational-evidence/relational-frame-raw.jsonl benchmarks/evidence/relational-frame-2026-10-24-run40089793501.jsonl
          cp /tmp/relational-evidence/relational-frame-raw.score.json benchmarks/evidence/relational-frame-2026-10-24-run40089793501.score.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmarks/evidence/relational-frame-2026-10-24-run40089793501.jsonl benchmarks/evidence/relational-frame-2026-10-24-run40089793501.score.json
          git commit -m 'research: archive verified relational-role evidence'
          git push origin HEAD:research/relational-frame-gate-20261024
