name: Four-model addendum offline validation
on:
  push:
    branches: [research/two-model-case-role-20261024]
    paths:
      - 'benchmarks/additional_models_case_role.py'
      - 'tests/test_additional_models_case_role.py'
      - '.github/workflows/four-model-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test additional-model identities and cross-model score integrity
        run: |
          python -m unittest discover -s tests -p 'test_additional_models_case_role.py' -v
          python -m unittest discover -s tests -p 'test_case_role_decoding.py' -v
