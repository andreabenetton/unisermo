name: One-shot tense instruction ablations
on:
  push:
    branches: [main]
    paths: ['.github/workflows/discourse-ablation-once.yml']
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Authorize one-shot test
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          test "$MSG" = 'ci: execute seven tense ablation variants' || exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate prompts
        run: |
          python - <<'PY'
          from benchmarks.discourse_tense_ablation import VARIANTS,build_variant
          from benchmarks.discourse_semantics import build
          baseline,key=build()
          assert len(VARIANTS)==7
          for variant in VARIANTS:
              q,k=build_variant(variant)
              assert k==key and len(q)==6
              assert all(q[i]['messages'][0]['content'].endswith(baseline[i]['messages'][0]['content']) for i in range(6))
          PY
      - name: Run bounded requests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m benchmarks.discourse_tense_ablation_runner --output benchmarks/reports/tense-ablation.jsonl
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tense-ablation-${{ github.run_id }}
          path: benchmarks/reports/tense-ablation*
          if-no-files-found: warn
          retention-days: 30
