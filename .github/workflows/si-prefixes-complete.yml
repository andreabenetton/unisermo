name: SI prefixes 24 complete
on:
  pull_request:
    paths:
      - 'formalization/**'
      - 'language/**'
      - 'research/lexicon/confirmed_lexicon.json'
      - 'docs/ldr/LDR-0029-all-24-si-prefixes.md'
      - 'tests/test_si_prefixes_complete.py'
      - '.github/workflows/si-prefixes-complete.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  si-prefixes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify generated indexes and accepted grammar
        run: |
          python -m formalization build --check
          python -m formalization validate
      - name: Validate all 24 SI prefixes and historical tests
        run: |
          python -m unittest discover -s tests -p 'test_si_prefixes_complete.py' -v
          python -m unittest discover -s tests -p 'test_basic_measurement_ellipsis.py' -v
          python -m unittest discover -s tests -p 'test_universal_quantities.py' -v
          python -m unittest discover -s tests -p 'test_numeric_likelihood_hyperbole.py' -v
