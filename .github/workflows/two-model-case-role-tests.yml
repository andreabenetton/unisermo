name: Two-model case-role offline validation
on:
  push:
    branches: [research/two-model-case-role-20261024]
    paths:
      - 'benchmarks/two_model_case_role.py'
      - 'tests/test_two_model_case_role.py'
      - '.github/workflows/two-model-case-role-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate model identity, paired prompts, and scoring contract
        run: |
          python -m unittest discover -s tests -p 'test_two_model_case_role.py' -v
          python -m unittest discover -s tests -p 'test_case_role_decoding.py' -v
