name: Numerical likelihood fractions
on:
  pull_request:
    paths:
      - 'formalization/**'
      - 'language/**'
      - 'docs/ldr/LDR-0026-numerical-likelihood-hyperbole.md'
      - 'tests/test_numeric_likelihood_hyperbole.py'
      - '.github/workflows/numeric-likelihood-hyperbole.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numeric-likelihood:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify generated indexes and canonical grammar
        run: |
          python -m formalization build --check
          python -m formalization validate
      - name: Numeric likelihood fraction and hyperbole tests
        run: python -m unittest discover -s tests -p 'test_numeric_likelihood_hyperbole.py' -v
      - name: Existing qualitative and epistemic regressions
        run: |
          python -m unittest discover -s tests -p 'test_gradable_probability_lik.py' -v
          python -m unittest discover -s tests -p 'test_propositional_tense_necessity.py' -v
