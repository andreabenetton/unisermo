name: Semantic contrast offline validation
on:
  push:
    branches: [research/semantic-contrast-pilot-20261024]
    paths:
      - 'benchmarks/semantic_contrast.py'
      - 'benchmarks/corpus/semantic-contrast-dev-001.jsonl'
      - 'tests/test_semantic_contrast.py'
      - '.github/workflows/semantic-contrast-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run semantic contrast corpus and scoring tests without API key
        run: python -m unittest discover -s tests -p 'test_semantic_contrast.py' -v
