name: Case-vs-role pilot offline validation
on:
  push:
    branches: [research/case-vs-role-decoding-20261024]
    paths:
      - 'benchmarks/case_role_decoding.py'
      - 'benchmarks/corpus/case-role-dev-001.jsonl'
      - 'tests/test_case_role_decoding.py'
      - '.github/workflows/case-role-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify parser source gate, new data, scoring and original parsers
        run: |
          python -m unittest discover -s tests -p 'test_case_role_decoding.py' -v
          python -m unittest discover -s tests -p 'test_relational_frames.py' -v
          python -m unittest discover -s tests -p 'test_relational_frame_meaning.py' -v
