name: Canonical proposition parser conformance
on:
  pull_request:
    paths:
      - 'formalization/**'
      - 'language/**'
      - 'tests/test_proposition_parser.py'
      - 'tests/test_focus_genitive_parser.py'
      - '.github/workflows/canonical-proposition-parser.yml'
  push:
    branches: [main]
    paths:
      - 'formalization/**'
      - 'language/**'
      - 'tests/test_proposition_parser.py'
      - 'tests/test_focus_genitive_parser.py'
      - '.github/workflows/canonical-proposition-parser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check derived sources and morphology
        run: |
          python -m formalization build --check
          python -m formalization validate
      - name: Execute typed parser and legacy API regressions
        run: |
          python -m unittest discover -s tests -p 'test_proposition_parser.py' -v
          python -m unittest discover -s tests -p 'test_focus_genitive_parser.py' -v
          python -m unittest discover -s tests -p 'test_formalization.py' -v
          python -m unittest discover -s tests -p 'test_multiplicative_parser.py' -v
          python -m unittest discover -s tests -p 'test_ordinal_parser.py' -v
          python -m unittest discover -s tests -p 'test_fraction_parser.py' -v
          python -m unittest discover -s tests -p 'test_kinship_parser.py' -v
